<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Screen Translator Overlay</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: transparent;
        font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
        color: #fff;
        user-select: none;
        -webkit-user-select: none;
        cursor: default;
      }

      #stage {
        position: absolute;
        inset: 0;
      }

      #loading {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.78);
        color: #fff;
        padding: 20px 36px;
        border-radius: 10px;
        font-size: 20px;
        font-weight: 500;
        box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        z-index: 5;
      }

      .ocr-item {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        background: rgba(255, 255, 255, 0.97);
        color: #000;
        border-radius: 6px;
        padding: 2px 6px;
        box-sizing: border-box;
        line-height: 1.18;
        white-space: nowrap;
        overflow: visible;
        word-break: normal;
        box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12);
        pointer-events: none;
      }

      .ocr-item.ocr-item--wrap {
        white-space: normal;
        overflow-wrap: break-word;
        word-break: normal;
      }

      #close-btn {
        position: fixed;
        top: 12px;
        right: 12px;
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(0, 0, 0, 0.7);
        color: #fff;
        font-size: 20px;
        line-height: 36px;
        text-align: center;
        cursor: pointer;
        border: 1px solid rgba(255, 255, 255, 0.25);
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.45);
        z-index: 10;
        font-weight: 600;
      }

      #close-btn:hover {
        background: rgba(220, 53, 69, 0.9);
      }

      #empty {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        padding: 12px 20px;
        border-radius: 8px;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="loading" style="display: none">Translating...</div>
    <div id="close-btn" title="Close (Esc)">×</div>

    <script>
      const { ipcRenderer } = require('electron');

      const stage = document.getElementById('stage');
      const loadingEl = document.getElementById('loading');
      const closeBtn = document.getElementById('close-btn');

      function closeOverlay() {
        ipcRenderer.send('overlay:close');
      }

      closeBtn.addEventListener('click', closeOverlay);
      window.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') {
          closeOverlay();
        }
      });

      const PAD_X = 12;
      const PAD_Y = 4;
      /** כל טקסטי ה־overlay באותו גודל גופן */
      const FONT_PX = 16;
      const FONT_FAMILY = '"Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif';

      const measureCanvas = document.createElement('canvas');
      const measureCtx = measureCanvas.getContext('2d');
      if (!measureCtx) {
        console.error('Overlay: canvas 2d context unavailable for text measurement');
      }

      function measureTextLineHeight(fontPx) {
        return Math.ceil(fontPx * 1.2 + 2);
      }

      function measureTextWidth(fontPx, text) {
        if (!measureCtx) return (text || '').length * fontPx * 0.55;
        measureCtx.font = `${fontPx}px ${FONT_FAMILY}`;
        return measureCtx.measureText(text || '').width;
      }

      /**
       * גודל גופן קבוע 16px; קופסה מתרחבת / עוטפת לפי אורך הטקסט.
       * @returns {{ width: number; height: number; left: number; top: number; wrap: boolean }}
       */
      function layoutExpandedLabel(text, baseW, baseH, left, top, overlayWidth, overlayHeight) {
        const t = text || '';
        const fontPx = FONT_PX;
        const lineH = measureTextLineHeight(fontPx);
        const textW = measureTextWidth(fontPx, t);

        const availableRight = Math.max(0, overlayWidth - left);
        const widthCap = Math.min(
          availableRight,
          Math.max(baseW * 2.2, 360),
        );

        let width;
        let height;
        let wrap = false;
        if (textW + PAD_X <= widthCap) {
          width = Math.max(baseW, Math.ceil(textW + PAD_X));
          height = Math.max(baseH, Math.ceil(lineH + PAD_Y));
        } else {
          width = Math.max(baseW, Math.ceil(widthCap));
          const innerW = Math.max(1, width - PAD_X);
          const linesNeeded = Math.max(1, Math.ceil((textW + innerW * 0.05) / innerW));
          height = Math.max(baseH, Math.ceil(lineH * linesNeeded + PAD_Y));
          wrap = true;
        }

        let l = left;
        let tt = top;
        if (l + width > overlayWidth) l = Math.max(0, overlayWidth - width);
        if (tt + height > overlayHeight) tt = Math.max(0, overlayHeight - height);
        if (l < 0) l = 0;
        if (tt < 0) tt = 0;

        return { width, height, left: l, top: tt, wrap };
      }

      function setLoadingVisible(on) {
        loadingEl.style.display = on ? 'block' : 'none';
      }

      function renderItems(payload) {
        stage.innerHTML = '';

        const { items, overlayWidth, overlayHeight, scaleX, scaleY } = payload;

        document.documentElement.style.width = `${overlayWidth}px`;
        document.documentElement.style.height = `${overlayHeight}px`;
        document.body.style.width = `${overlayWidth}px`;
        document.body.style.height = `${overlayHeight}px`;

        if (!items || items.length === 0) {
          const msg = document.createElement('div');
          msg.id = 'empty';
          msg.textContent = payload.errorMessage || 'No OCR items to display.';
          document.body.appendChild(msg);
          return 0;
        }

        let placed = 0;
        for (const item of items) {
          const vertices = (item.boundingPoly && item.boundingPoly.vertices) || [];
          if (vertices.length === 0) continue;

          const xs = vertices.map((v) => v.x || 0);
          const ys = vertices.map((v) => v.y || 0);
          const minX = Math.min(...xs);
          const minY = Math.min(...ys);
          const maxX = Math.max(...xs);
          const maxY = Math.max(...ys);

          const left = minX * scaleX;
          const top = minY * scaleY;
          const baseW = Math.max(8, (maxX - minX) * scaleX);
          const baseH = Math.max(8, (maxY - minY) * scaleY);

          const el = document.createElement('div');
          el.className = 'ocr-item';
          const text = item.translatedText != null ? String(item.translatedText).trim() : '';
          if (!text) {
            continue;
          }
          const lay = layoutExpandedLabel(text, baseW, baseH, left, top, overlayWidth, overlayHeight);
          el.style.left = lay.left + 'px';
          el.style.top = lay.top + 'px';
          el.style.width = lay.width + 'px';
          el.style.height = lay.height + 'px';
          el.style.fontSize = FONT_PX + 'px';
          el.style.direction = item.sourceWasRtl ? 'rtl' : 'ltr';
          if (lay.wrap) el.classList.add('ocr-item--wrap');
          el.textContent = text;
          stage.appendChild(el);
          placed++;
        }

        return placed;
      }

      async function paintFromPayload() {
        const tRender0 = performance.now();
        const payload = await ipcRenderer.invoke('overlay:get-data');
        if (!payload) {
          closeOverlay();
          return;
        }

        if (payload.loading) {
          setLoadingVisible(true);
          ipcRenderer.send('overlay:ready', {
            phase: 'loading',
            count: 0,
            renderMs: performance.now() - tRender0,
          });
          return;
        }

        setLoadingVisible(false);
        const count = renderItems(payload);
        ipcRenderer.send('overlay:ready', {
          phase: 'content',
          count,
          renderMs: performance.now() - tRender0,
        });
      }

      ipcRenderer.on('overlay:update', () => {
        void paintFromPayload();
      });

      void paintFromPayload();
    </script>
  </body>
</html>
